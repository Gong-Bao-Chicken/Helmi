<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Find the right bicycle helmet: independent lab safety ratings matched with current prices." />
    <title>Helmi</title>
    <!-- Start downloading the data with the page, not after the app's code has loaded. -->
    <link rel="preload" href="./data/helmets.site.json" as="fetch" crossorigin="anonymous" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><path d='M4 20a12 12 0 0 1 24 0v2H4z' fill='%2300766d'/><path d='M8 22h20l-2 4H8z' fill='%2300766d' opacity='.6'/></svg>" />
    <script>
      try {
        const t = localStorage.getItem("helmet-compare-theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
        const c = localStorage.getItem("helmet-compare-colorway");
        if (c && c !== "benzol") document.documentElement.dataset.colorway = c;
      } catch {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
